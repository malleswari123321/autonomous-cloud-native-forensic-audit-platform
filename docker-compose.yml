version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: forensic_postgres
    restart: always
    environment:
      POSTGRES_USER: forensic_user
      POSTGRES_PASSWORD: forensic_password_2026
      POSTGRES_DB: forensic_audit_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data

  neo4j-db:
    image: neo4j:5.12-community
    container_name: forensic_neo4j
    restart: always
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=neo4j/forensic_neo4j_2026
      - NEO4J_PLUGINS=["apoc"] 
    volumes:
      - ./docker-data/neo4j/data:/data
      - ./docker-data/neo4j/logs:/logs
